
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aviator Mobile</title>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --bg-card: #1b1b22;
            --primary-red: #da1f3d;
            --btn-green: #29a744;
            --border: #2a2a35;
            --blue-accent: #0f34ac;
            --text-gray: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark); 
            color: white; 
            overflow-x: hidden;
            line-height: 1.2;
        }

        /* Responsive Header */
        header { 
            background: linear-gradient(90deg, #970c24, #1e1b4b); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 12px; 
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .balance-pill {
            background: #000;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .deposit-txt { color: var(--primary-red); font-weight: 800; border-left: 1px solid #334155; padding-left: 8px; }

        /* Game Screen - Aspect Ratio Box */
        .game-container {
            width: 100%;
            background-color: #000;
            position: relative;
            overflow: hidden;
            /* Height based on common betting app ratios */
            height: 220px; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #2e050c 0%, #000 100%);
        }

        .multiplier {
            font-size: 4.5rem;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .multiplier.crashed { color: var(--primary-red); }

        /* Betting Section - Mobile Grid */
        .bet-area {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bet-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            height: 80px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .number-stepper {
            background: #000;
            display: flex;
            align-items: center;
            border-radius: 6px;
            height: 40px;
        }

        .step-btn {
            background: none;
            border: none;
            color: var(--primary-red);
            font-size: 1.5rem;
            width: 40px;
            font-weight: bold;
        }

        .amount-input {
            background: none;
            border: none;
            color: white;
            text-align: center;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .chip {
            background: var(--blue-accent);
            border: 1px solid #2563eb;
            color: white;
            font-size: 0.7rem;
            padding: 4px 0;
            border-radius: 4px;
            text-align: center;
        }

        /* The Big Button */
        .action-btn {
            flex: 1;
            background: var(--btn-green);
            border: none;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 0 #166534;
        }

        .action-btn.betting { background: var(--bg-dark); color: #64748b; box-shadow: none; border: 1px solid #334155; }
        .action-btn.cashout { background: #f59e0b; box-shadow: 0 4px 0 #b45309; }

        .btn-top { font-size: 0.7rem; text-transform: uppercase; }
        .btn-main { font-size: 1.1rem; }

        /* Auto Switch Row */
        .auto-row {
            background: #26262e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Custom Toggle */
        .toggle {
            width: 40px;
            height: 20px;
            background: #475569;
            border-radius: 10px;
            position: relative;
            transition: 0.3s;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 16px; height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px; left: 2px;
            transition: 0.3s;
        }
        .toggle.on { background: #94a3b8; }
        .toggle.on::after { left: 22px; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #1e293b;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            color: var(--text-gray);
            gap: 4px;
        }

        .nav-item.active { color: white; }
        .nav-icon { width: 20px; height: 20px; opacity: 0.7; }
        .active .nav-icon { opacity: 1; filter: brightness(1.5); }

    </style>
</head>
<body>

    <header>
        <div style="font-weight: 900; font-style: italic; font-size: 1.2rem;">AVIATOR</div>
        <div class="balance-pill">
            <span style="color: #64748b; font-size: 0.7rem;">KES</span>
            <span id="bal-val">1,000.00</span>
            <span class="deposit-txt">DEPOSIT</span>
        </div>
    </header>

    <div class="game-container">
        <div class="multiplier" id="display">1.00x</div>
        <div style="position: absolute; bottom: 8px; right: 12px; color: #475569; font-size: 10px;">ROUND ID: #243292</div>
    </div>

    <div class="bet-area">
        <div class="bet-card">
            <div class="controls-row">
                <div class="input-group">
                    <div class="number-stepper">
                        <button class="step-btn" onclick="adjust(1, -10)">-</button>
                        <input type="number" id="in-1" value="20" class="amount-input">
                        <button class="step-btn" onclick="adjust(1, 10)">+</button>
                    </div>
                    <div class="chip-grid">
                        <div class="chip" onclick="set(1, 50)">50</div>
                        <div class="chip" onclick="set(1, 100)">100</div>
                        <div class="chip" onclick="set(1, 200)">200</div>
                        <div class="chip" onclick="set(1, 500)">500</div>
                    </div>
                </div>
                <button class="action-btn" id="btn-1" onclick="handleBet(1)">
                    <span class="btn-top">BET [NEXT GAME]</span>
                    <span class="btn-main" id="btxt-1">KES 20.00</span>
                </button>
            </div>
            <div class="auto-row">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="toggle" id="t-1" onclick="this.classList.toggle('on')"></div>
                    AUTO CASH OUT
                </div>
                <div style="background: #000; padding: 4px 12px; border-radius: 4px; color: #64748b;">1.20</div>
            </div>
        </div>

        <div class="bet-card">
            <div class="controls-row">
                <div class="input-group">
                    <div class="number-stepper">
                        <button class="step-btn" onclick="adjust(2, -10)">-</button>
                        <input type="number" id="in-2" value="20" class="amount-input">
                        <button class="step-btn" onclick="adjust(2, 10)">+</button>
                    </div>
                    <div class="chip-grid">
                        <div class="chip" onclick="set(2, 50)">50</div>
                        <div class="chip" onclick="set(2, 100)">100</div>
                        <div class="chip" onclick="set(2, 200)">200</div>
                        <div class="chip" onclick="set(2, 500)">500</div>
                    </div>
                </div>
                <button class="action-btn" id="btn-2" onclick="handleBet(2)">
                    <span class="btn-top">BET [NEXT GAME]</span>
                    <span class="btn-main" id="btxt-2">KES 20.00</span>
                </button>
            </div>
            <div class="auto-row">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="toggle" id="t-2" onclick="this.classList.toggle('on')"></div>
                    AUTO CASH OUT
                </div>
                <div style="background: #000; padding: 4px 12px; border-radius: 4px; color: #64748b;">1.20</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item"><span class="nav-icon">📁</span>WALLET</div>
        <div class="nav-item active"><span class="nav-icon">🎮</span>PLAY</div>
        <div class="nav-item"><span class="nav-icon">➕</span>DEPOSIT</div>
        <div class="nav-item"><span class="nav-icon">💸</span>WITHDRAW</div>
    </nav>

    <script>
        let balance = 1000;
        let running = false;
        let mult = 1.0;
        let bets = { 1: null, 2: null };

        function adjust(id, amt) {
            let el = document.getElementById('in-'+id);
            let val = Math.max(10, parseInt(el.value) + amt);
            el.value = val;
            updateBtn(id);
        }

        function set(id, amt) {
            document.getElementById('in-'+id).value = amt;
            updateBtn(id);
        }

        function updateBtn(id) {
            if (bets[id]) return;
            document.getElementById('btxt-'+id).innerText = 'KES ' + document.getElementById('in-'+id).value + '.00';
        }

        function handleBet(id) {
            let btn = document.getElementById('btn-'+id);
            let amt = parseInt(document.getElementById('in-'+id).value);

            if (!running) {
                // Pre-game bet
                if (balance >= amt) {
                    bets[id] = { amt: amt, active: true };
                    btn.classList.add('betting');
                    btn.innerHTML = '<span class="btn-top">WAITING...</span>';
                }
            } else if (bets[id] && bets[id].active) {
                // Cashout
                let win = bets[id].amt * mult;
                balance += win;
                bets[id].active = false;
                btn.classList.remove('cashout');
                btn.classList.add('betting');
                btn.innerHTML = '<span class="btn-top">SUCCESS</span><span class="btn-main">KES '+win.toFixed(2)+'</span>';
                document.getElementById('bal-val').innerText = balance.toFixed(2);
            }
        }

        function gameLoop() {
            running = true;
            mult = 1.0;
            let crashAt = 1.1 + (Math.random() * 5);
            
            let tick = setInterval(() => {
                mult += 0.01;
                document.getElementById('display').innerText = mult.toFixed(2) + 'x';
                document.getElementById('display').classList.remove('crashed');

                // Update live cashout buttons
                [1,2].forEach(id => {
                    if (bets[id] && bets[id].active) {
                        let btn = document.getElementById('btn-'+id);
                        btn.classList.remove('betting');
                        btn.classList.add('cashout');
                        btn.innerHTML = `<span class="btn-top">CASH OUT</span><span class="btn-main">${(bets[id].amt * mult).toFixed(2)}</span>`;
                    }
                });

                if (mult >= crashAt) {
                    clearInterval(tick);
                    running = false;
                    document.getElementById('display').innerText = mult.toFixed(2) + 'x FLEW AWAY!';
                    document.getElementById('display').classList.add('crashed');
                    
                    // Deduct losing bets
                    [1,2].forEach(id => {
                        if (bets[id] && bets[id].active) {
                            balance -= bets[id].amt;
                        }
                        bets[id] = null;
                        document.getElementById('btn-'+id).classList.remove('betting', 'cashout');
                        updateBtn(id);
                        document.getElementById('btn-'+id).querySelector('.btn-top').innerText = 'BET [NEXT GAME]';
                    });
                    
                    document.getElementById('bal-val').innerText = balance.toFixed(2);
                    setTimeout(gameLoop, 4000);
                }
            }, 100);
        }

        gameLoop();
    </script>
</body>
</html>

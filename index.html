
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Mobile Responsive</title>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --bg-panel: #1b1b22;
            --primary-red: #da1f3d;
            --btn-green: #29a744;
            --chip-blue: #0f34ac;
            --chip-border: #1a51f0;
            --text-gray: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 10px;
        }

        /* Stake Selector Container */
        .stake-selector {
            background-color: var(--bg-panel);
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 8px;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Top Row: Input and Big Green Button */
        .bet-controls {
            display: flex;
            gap: 8px;
            height: 90px; /* Fixed height for mobile consistency */
        }

        .input-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Stepper +/- */
        .stepper {
            background-color: #000;
            display: flex;
            align-items: center;
            border-radius: 6px;
            height: 45px;
            border: 1px solid #333;
        }

        .step-btn {
            background: none;
            border: none;
            color: var(--primary-red);
            font-size: 1.8rem;
            width: 45px;
            height: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        .amount-input {
            background: none;
            border: none;
            color: white;
            text-align: center;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            outline: none;
        }

        /* Preset Chips */
        .chips-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .chip {
            background: var(--chip-blue);
            border: 1px solid var(--chip-border);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 0;
            border-radius: 4px;
            text-align: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        /* Green Bet Button */
        .bet-btn {
            flex: 1;
            background-color: var(--btn-green);
            border: none;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 0 #166534;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .bet-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #166534;
        }

        .bet-label { font-size: 10px; opacity: 0.9; margin-bottom: 2px; }
        .bet-value { font-size: 16px; }

        /* Auto Cash Out Row */
        .auto-cashout {
            background: linear-gradient(180deg, #2a2a35, #1b1b22);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #94a3b8; }
        input:checked + .slider:before { transform: translateX(22px); }

        .auto-val-box {
            background-color: #000;
            color: var(--text-gray);
            padding: 4px 15px;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="stake-selector">
        
        <div class="bet-controls">
            
            <div class="input-section">
                <div class="stepper">
                    <button class="step-btn" onclick="updateVal(-10)">−</button>
                    <input type="number" id="betAmount" value="20" class="amount-input" readonly>
                    <button class="step-btn" onclick="updateVal(10)">+</button>
                </div>
                
                <div class="chips-grid">
                    <div class="chip" onclick="setVal(50)">50</div>
                    <div class="chip" onclick="setVal(100)">100</div>
                    <div class="chip" onclick="setVal(200)">200</div>
                    <div class="chip" onclick="setVal(500)">500</div>
                </div>
            </div>

            <button class="bet-btn" onclick="placeBet()">
                <span class="bet-label">BET [NEXT GAME]</span>
                <span class="bet-value" id="btnDisplay">KES 20.00</span>
            </button>

        </div>

        <div class="auto-cashout">
            <div class="toggle-group">
                <label class="switch">
                    <input type="checkbox" id="autoCheck">
                    <span class="slider"></span>
                </label>
                <span>AUTO CASH OUT</span>
            </div>
            <div class="auto-val-box">1.20</div>
        </div>

    </div>

    <script>
        const input = document.getElementById('betAmount');
        const display = document.getElementById('btnDisplay');

        function updateVal(amt) {
            let current = parseInt(input.value);
            let newVal = Math.max(10, current + amt);
            input.value = newVal;
            display.innerText = `KES ${newVal}.00`;
        }

        function setVal(amt) {
            input.value = amt;
            display.innerText = `KES ${amt}.00`;
        }

        function placeBet() {
            const amt = input.value;
            alert(`Bet of KES ${amt} placed for next round!`);
        }
    </script>
</body>
</html>
